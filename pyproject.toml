[project]
name = "marketbot"
version = "1.0.0"
description = "Telegram bot for tracking Steam Community Market prices, alerts and PnL"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marketbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::SyntaxWarning"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# SIM117: job bodies nest a run-tracking context inside a transaction context on
# purpose -- collapsing them hides which context owns the failure path.
ignore = ["E501", "B008", "SIM108", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
